name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    name: Validate codebase for node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x", "26.x"]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: labd/gh-actions-typescript/pnpm-install@ada4548df9a365c62c8b396b583953c6d4bc113f # v1.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Check formatting and linting
        run: pnpm biome ci

      - name: Check typing
        run: pnpm tsc

      - name: Test
        run: pnpm run test:ci

      - name: "Report Coverage"
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1

      - name: Build
        run: pnpm build

  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC)
      contents: write # push version-bump commit + tags
      pull-requests: write # create/update the release PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No dependency cache in the release job (cache poisoning)
      - name: Set up Node.js
        uses: labd/gh-actions-typescript/pnpm-install@ada4548df9a365c62c8b396b583953c6d4bc113f # v1.1.0
        with:
          cache: "false"

      - name: Upgrade npm for trusted publishing
        run: npm i -g npm@^11.6.4

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create and publish versions
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "Release new version"
          commit-message: "update version"
          publish-script: pnpm publish:ci
          version-script: pnpm publish:version
          # v2 pushes the release commit and tags through the GitHub API; the
          # git CLI path keeps the previous behaviour.
          push-with-git-cli: true
        env:
          NPM_CONFIG_PROVENANCE: true
